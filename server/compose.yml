# Despliegue del servicio. En producción lo copia deploy-server.yml a
# /srv/cuaderno y se levanta con `VERSION=x.y.z docker compose --env-file .env up -d`.
# El .env vive solo en el VPS (CUADERNO_UID, CUADERNO_GID, APP_MIN_VERSION).
# Antes del primer arranque con datos: crear /srv/cuaderno/data (de CUADERNO_UID) y
# /srv/cuaderno-secrets/pepper.txt (un valor secreto de 32 bytes o más, legible por CUADERNO_UID, chmod 600, fuera del repo).
# Conviene chmod 700 en la carpeta de datos.
services:
  cuaderno-server:
    image: cuaderno-server:${VERSION}
    container_name: cuaderno-server
    user: "${CUADERNO_UID}:${CUADERNO_GID}"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.5
    environment:
      PORT: "8094"
      DATA_DIR: /data
      LOG_LEVEL: info
      APP_MIN_VERSION: ${APP_MIN_VERSION:?falta APP_MIN_VERSION en el .env}
      PEPPER_FILE: /run/secrets/pepper
    secrets: [pepper]
    volumes:
      - /srv/cuaderno/data:/data
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: 5m, max-file: "3" } }
secrets:
  pepper: { file: /srv/cuaderno-secrets/pepper.txt }
networks:
  proxy: { external: true }
