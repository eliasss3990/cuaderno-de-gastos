name: Sembrar caché del SDK

# Un PR solo lee cachés de su rama o de la rama base. Este flujo guarda el caché
# del SDK de Android una vez bajo refs/heads/next para que los PR lo restauren.
# La clave y los paquetes deben coincidir con los de ci-app.yml y release-app.yml.
on:
  push:
    branches: [next]
    paths:
      - 'app/**'
      - '.github/workflows/warm-sdk-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-sdk-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    name: Sembrar caché del SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Cachear paquetes del Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-37.1-build-tools-37.0.0
      - name: Instalar paquetes del SDK necesarios
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
