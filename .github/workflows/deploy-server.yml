name: Desplegar servidor

# Solo por etiqueta server-v* (que debe apuntar a main) o a mano, nunca por
# pull_request: el runner autoalojado del VPS tiene acceso a Docker, que equivale
# a administrar el servidor. Corre en el runner `cuaderno-runner` (etiqueta
# `cuaderno`) dentro del environment `produccion`, con aprobación manual.
on:
  push:
    tags: ['server-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a desplegar (sin el prefijo server-v), por ejemplo 0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar en el VPS
    runs-on: [self-hosted, cuaderno]
    environment: produccion
    timeout-minutes: 20
    env:
      COMPOSE_DIR: /srv/cuaderno
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolver la versión
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${REF_NAME#server-v}"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::versión inválida: '$V'"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Verificar que la etiqueta esté en main
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git fetch origin main
          git rev-parse "refs/tags/server-v$VERSION" >/dev/null 2>&1 || { echo "::error::no existe la etiqueta server-v$VERSION"; exit 1; }
          git merge-base --is-ancestor "refs/tags/server-v$VERSION" origin/main || { echo "::error::server-v$VERSION no está en main"; exit 1; }
          git checkout --detach "refs/tags/server-v$VERSION"
      - name: Guardar la versión actual para la reversa
        id: prev
        run: |
          prev=$(docker inspect -f '{{index .Config.Image}}' cuaderno-server 2>/dev/null | sed 's/.*://' || true)
          echo "version=$prev" >> "$GITHUB_OUTPUT"
      - name: Construir la imagen
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: docker build -t "cuaderno-server:$VERSION" server
      - name: Respaldo previo de la base
        id: respaldo
        run: |
          # justo antes de levantar la versión nueva (después del build: lo que se escriba mientras tanto no se pierde en una
          # reversa); la reversa vuelve a esta copia porque una imagen anterior no abre una base que la nueva ya migró
          estado=$(docker inspect -f '{{.State.Status}}' cuaderno-server 2>/dev/null || echo ausente)
          if [ "$estado" != running ]; then
            echo "::warning::el servicio no está corriendo ($estado): despliegue sin respaldo previo; si la versión nueva migra y falla, la anterior no podrá abrir la base. Si no es el primer despliegue, conviene cancelar y revisar el servicio"
          elif ayuda=$(docker exec cuaderno-server node dist/admin.js ayuda 2>/dev/null) && grep -q '^  backup ' <<< "$ayuda"; then
            salida=$(docker exec cuaderno-server node dist/admin.js backup --motivo predeploy)
            echo "$salida"
            archivo=$(printf '%s\n' "$salida" | sed -n 's#^respaldo: /backups/##p')
            [ -n "$archivo" ] || { echo "::error::el respaldo previo no informó su archivo"; exit 1; }
            echo "archivo=$archivo" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::la versión que corre no tiene respaldos (admin.js backup): despliegue sin respaldo previo"
          fi
      - name: Levantar el servicio
        id: levantar
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # las carpetas de datos y de adjuntos las tiene que poder escribir el usuario del contenedor: si no existen, Docker las
          # crearía como root y el servidor no arrancaría
          mkdir -m 700 -p "$COMPOSE_DIR/data" "$COMPOSE_DIR/adjuntos" "$COMPOSE_DIR/backups/base" "$COMPOSE_DIR/backups/adjuntos"
          cp server/compose.yml "$COMPOSE_DIR/compose.yml"
          # el respaldo diario: el script y su línea en el cron del usuario del runner (sin duplicarla en cada despliegue)
          install -m 755 server/scripts/respaldo-diario.sh "$COMPOSE_DIR/respaldo-diario.sh"
          if command -v crontab >/dev/null; then
            linea="0 3 * * * $COMPOSE_DIR/respaldo-diario.sh >> $COMPOSE_DIR/backups/respaldo.log 2>&1"
            { crontab -l 2>/dev/null | grep -vF "$COMPOSE_DIR/respaldo-diario.sh" || true; echo "$linea"; } | crontab -
          else
            echo "::warning::no hay crontab en el VPS: el respaldo diario no quedó programado"
          fi
          cd "$COMPOSE_DIR"
          # desde acá la versión nueva pudo tocar la base: recién ahora una falla necesita reversa
          echo "desplegado=1" >> "$GITHUB_OUTPUT"
          VERSION="$VERSION" docker compose --env-file .env up -d
      - name: Esperar a que esté healthy
        run: |
          for _ in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' cuaderno-server 2>/dev/null || echo ausente)
            echo "salud: $s"
            [ "$s" = healthy ] && exit 0
            sleep 4
          done
          exit 1
      - name: Prueba de humo
        run: docker exec cuaderno-server node dist/admin.js humo
      - name: Reversa si algo falló
        # si falló antes de levantar la versión nueva (build, respaldo), la vieja sigue corriendo intacta: no hay nada que revertir
        if: (failure() || cancelled()) && steps.prev.outputs.version != '' && steps.levantar.outputs.desplegado == '1'
        env:
          PREV: ${{ steps.prev.outputs.version }}
          RESPALDO: ${{ steps.respaldo.outputs.archivo }}
        run: |
          cd "$COMPOSE_DIR"
          echo "Reversa a cuaderno-server:$PREV"
          VERSION="$PREV" docker compose --env-file .env stop cuaderno-server || true
          if [ -n "$RESPALDO" ]; then
            # restaurar no puede ver desde su contenedor si el servicio sigue vivo: se comprueba acá
            if [ "$(docker inspect -f '{{.State.Running}}' cuaderno-server 2>/dev/null || echo false)" = true ]; then
              echo "::error::el servicio no se detuvo: no se restaura con el servicio vivo. A mano: detenerlo y restaurar /backups/$RESPALDO"
              exit 1
            fi
            # con el servicio detenido, la imagen anterior restaura la base de antes del despliegue; si no puede, el servicio
            # queda detenido a propósito: la imagen anterior no debe arrancar sobre una base que la nueva ya migró
            if ! VERSION="$PREV" docker compose --env-file .env run --rm --no-deps cuaderno-server node dist/admin.js restaurar --desde "/backups/$RESPALDO"; then
              echo "::error::no se pudo restaurar /backups/$RESPALDO: el servicio quedó DETENIDO. A mano: cd $COMPOSE_DIR && VERSION=$PREV docker compose --env-file .env run --rm --no-deps cuaderno-server node dist/admin.js restaurar --desde /backups/$RESPALDO && VERSION=$PREV docker compose --env-file .env up -d"
              exit 1
            fi
            echo "::warning::la base volvió a /backups/$RESPALDO: lo que se escribió después quedó en la copia prerestauracion más nueva de /backups (los celulares lo vuelven a subir solos)"
          fi
          VERSION="$PREV" docker compose --env-file .env up -d
      - name: Conservar solo las últimas 3 imágenes
        if: success()
        run: |
          docker images cuaderno-server --format '{{.Tag}}' | sort -rV | tail -n +4 | xargs -r -I{} docker rmi "cuaderno-server:{}" || true
