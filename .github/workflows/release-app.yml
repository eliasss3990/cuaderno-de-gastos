name: Release app

# Corre tras un merge a main que cambie la app. Los vectores de conformidad (conformance/) no publican la app:
# se publican con ella la próxima vez que cambie. Si la versión ya está publicada, no hace nada.
# No vuelve a aprobar nada: empaqueta y publica lo que el CI ya validó.
# Las Releases de la app llevan la etiqueta app-v<versionName>; el servidor usa
# server-v<versión> sin Release, así la "última Release" siempre es la de la app.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/release-app.yml'

permissions:
  contents: write

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  version:
    name: Versión a publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publicar: ${{ steps.existe.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - name: Leer versionName
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/android/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: ¿Ya está publicada?
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # sin subir la versión no hay nada nuevo que publicar (y no se pisa la Release existente)
          if gh release view "app-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "app-v$VERSION ya está publicada: no se publica de nuevo"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Firmar y publicar la Release
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: app
      - uses: android-actions/setup-android@v4
      - name: Cachear paquetes del Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-37.1-build-tools-37.0.0
      - name: Instalar paquetes del SDK necesarios
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Verificar que estén todos los secretos de firma
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing+=("RELEASE_KEYSTORE_BASE64")
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing+=("RELEASE_KEYSTORE_PASSWORD")
          [ -z "$RELEASE_KEY_ALIAS" ] && missing+=("RELEASE_KEY_ALIAS")
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing+=("RELEASE_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan secretos de firma de release: ${missing[*]}"
            exit 1
          fi
      - name: Decodificar el keystore de release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"
      - name: Compilar el APK de release firmado
        working-directory: app
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
      - name: Publicar la GitHub Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ needs.version.outputs.version }}
          name: app-v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: app/android/build/outputs/apk/release/*-release.apk
          fail_on_unmatched_files: true
